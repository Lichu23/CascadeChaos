<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Card</title>
    <link rel="stylesheet" href="travelStyle.css" />
  </head>
  <body>
    <main class="page">
      <article class="card travel">
        <header class="card-header">
          <div>
            <h1>Bali Getaway</h1>
            <p class="meta">4 days · 3 nights · Beach escape</p>
          </div>
          <span class="tag">Booked</span>
        </header>

        <section class="trip-plan">
          <div class="trip-day">
            <h2>Day 1</h2>
            <p>Arrival, hotel check-in, sunset beach walk.</p>
          </div>
          <div class="trip-day">
            <h2>Day 2</h2>
            <p>Temple tour, lunch at local cafe, evening yoga.</p>
          </div>
        </section>

        <div class="details">
          <div><span>9:00 AM</span> · Airport pickup</div>
          <div><span>1:00 PM</span> · Surf lesson</div>
          <div><span>7:00 PM</span> · Dinner at seaside</div>
        </div>
      </article>
    </main>
  </body>
</html>
