<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Card</title>
    <link rel="stylesheet" href="musicStyle.css" />
  </head>
  <body>
    <main class="page">
      <article class="card music">
        <header class="card-header">
          <h1>Now Playing</h1>
          <p class="meta">The Weeknd · After Hours</p>
        </header>

        <section class="main">
          <div class="icon" aria-hidden="true">🎧</div>
          <div class="song">Blinding Lights</div>
        </section>

        <ul class="forecast">
          <li class="day"><span class="label">PLAY</span><span>ON</span><span>▶</span></li>
          <li class="day"><span class="label">LIKE</span><span>85%</span><span>♥</span></li>
          <li class="day"><span class="label">DUR</span><span>3:20</span><span>⏱</span></li>
          <li class="day"><span class="label">GENRE</span><span>POP</span><span>🎵</span></li>
          <li class="day"><span class="label">MOOD</span><span>HIGH</span><span>⚡</span></li>
        </ul>
      </article>
    </main>
  </body>
</html>
