<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Card</title>
    <link rel="stylesheet" href="cryptoStyle.css" />
  </head>
  <body>
    <main class="page">
      <article class="card crypto">
        <header class="card-header">
          <h1>Bitcoin (BTC)</h1>
          <p class="meta">Crypto · Bullish trend · +3.8%</p>
        </header>

        <section class="main">
          <div class="icon" aria-hidden="true">₿</div>
          <div class="price">42,500$</div>
        </section>

        <ul class="forecast">
          <li class="day"><span class="label">MON</span><span>41K</span><span>39K</span></li>
          <li class="day"><span class="label">TUE</span><span>42K</span><span>40K</span></li>
          <li class="day"><span class="label">WED</span><span>43K</span><span>41K</span></li>
          <li class="day"><span class="label">THU</span><span>44K</span><span>42K</span></li>
          <li class="day"><span class="label">FRI</span><span>45K</span><span>43K</span></li>
        </ul>
      </article>
    </main>
  </body>
</html>
