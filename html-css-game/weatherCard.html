<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Card</title>
    <link rel="stylesheet" href="weatherStyle.css" />
  </head>
  <body>
    <main class="page">
      <article class="card weather">
        <header class="card-header">
          <div>
            <h1>San Francisco</h1>
            <p class="meta">Partly cloudy · 68°F</p>
          </div>
          <div class="icon">☁️</div>
        </header>

        <section class="today">
          <p class="temp">68°F</p>
          <p class="condition">Light breeze · 65% humidity</p>
        </section>

        <ul class="forecast">
          <li class="day"><span>MON</span><strong>70°</strong><small>58°</small></li>
          <li class="day"><span>TUE</span><strong>72°</strong><small>59°</small></li>
          <li class="day"><span>WED</span><strong>68°</strong><small>56°</small></li>
          <li class="day"><span>THU</span><strong>66°</strong><small>55°</small></li>
          <li class="day"><span>FRI</span><strong>69°</strong><small>57°</small></li>
        </ul>
      </article>
    </main>
  </body>
</html>
