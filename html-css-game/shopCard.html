<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Card</title>
    <link rel="stylesheet" href="shopStyle.css" />
  </head>
  <body>
    <main class="page">
      <article class="card shop">
        <div class="badge">Sale</div>
        <div class="item-top">
          <div class="image">⌚</div>
          <div>
            <h1>Smart Watch</h1>
            <p class="meta">Bluetooth · Heart rate · 5 days battery</p>
          </div>
        </div>

        <div class="pricing">
          <span class="price">$129</span>
          <span class="old-price">$179</span>
        </div>

        <button class="buy">Add to cart</button>
      </article>
    </main>
  </body>
</html>
