<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="profileStyle.css" />
  </head>
  <body>
    <main class="page">
      <article class="card profile">
        <header class="profile-header">
          <div class="avatar">JL</div>
          <div>
            <h1>Jordan Lee</h1>
            <p class="meta">UI Designer</p>
          </div>
        </header>

        <section class="bio">
          <p>Enjoys building simple components and clean interfaces for mobile and web.</p>
        </section>

        <div class="stats">
          <div class="stat"><strong>28</strong><span>Projects</span></div>
          <div class="stat"><strong>124</strong><span>Followers</span></div>
          <div class="stat"><strong>5</strong><span>Mentions</span></div>
        </div>

        <div class="actions">
          <button>Follow</button>
          <button class="secondary">Message</button>
        </div>
      </article>
    </main>
  </body>
</html>
