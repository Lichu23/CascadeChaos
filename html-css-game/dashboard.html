<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Card</title>
  <link rel="stylesheet" href="dashboardStyle.css">
</head>

<body>
  <main class="wrapper">
    <article class="card dashboard">
      <header class="card-header">
        <div>
          <h1>AAPL Stock</h1>
          <p class="meta">NASDAQ · +1.25% today · Volume high</p>
        </div>
        <span class="badge">Market Watch</span>
      </header>

      <section class="overview">
        <div class="summary">
          <div class="icon" aria-hidden="true">📈</div>
          <div>
            <p class="label">Current price</p>
            <p class="price">189$</p>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-value">+1.25%</span>
            <span class="stat-label">today</span>
          </div>
          <div class="stat">
            <span class="stat-value">32.1M</span>
            <span class="stat-label">volume</span>
          </div>
          <div class="stat">
            <span class="stat-value">$192</span>
            <span class="stat-label">high</span>
          </div>
        </div>
      </section>

      <section class="forecast">
        <div class="day"><span class="label">MON</span><strong>185</strong><span>180</span></div>
        <div class="day"><span class="label">TUE</span><strong>190</strong><span>182</span></div>
        <div class="day"><span class="label">WED</span><strong>192</strong><span>188</span></div>
        <div class="day"><span class="label">THU</span><strong>195</strong><span>189</span></div>
        <div class="day"><span class="label">FRI</span><strong>198</strong><span>191</span></div>
      </section>
    </article>
  </main>
</body>
</html>
