<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Card</title>
    <link rel="stylesheet" href="productivityStyle.css" />
  </head>
  <body>
    <main class="page">
      <article class="card task">
        <header class="card-header">
          <h1>Today Tasks</h1>
          <p class="meta">4 tasks remaining</p>
        </header>

        <section class="main">
          <div class="icon" aria-hidden="true">📅</div>
          <div class="status">Focus Mode</div>
        </section>

        <ul class="forecast">
          <li class="day"><span class="label">CODE</span><span>DONE</span><span>✓</span></li>
          <li class="day"><span class="label">STUDY</span><span>2H</span><span>⏳</span></li>
          <li class="day"><span class="label">EMAIL</span><span>5</span><span>✉</span></li>
          <li class="day"><span class="label">GYM</span><span>YES</span><span>🏋️</span></li>
          <li class="day"><span class="label">REST</span><span>NIGHT</span><span>🌙</span></li>
        </ul>
      </article>
    </main>
  </body>
</html>
