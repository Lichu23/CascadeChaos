<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitness Card</title>
    <link rel="stylesheet" href="fitnessStyle.css" />
  </head>
  <body>
    <main class="page">
      <article class="card fitness">
        <header class="card-header">
          <div>
            <h1>Daily Workout</h1>
            <p class="meta">Strength · Cardio · Stretch</p>
          </div>
          <span class="goal">Goal 8/10</span>
        </header>

        <div class="meter">
          <span class="meter-fill"></span>
        </div>

        <div class="metrics">
          <div class="metric"><strong>32</strong><span>Min</span></div>
          <div class="metric"><strong>1.8</strong><span>kcal</span></div>
          <div class="metric"><strong>4</strong><span>Exercises</span></div>
        </div>
      </article>
    </main>
  </body>
</html>
