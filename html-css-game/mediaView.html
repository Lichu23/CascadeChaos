<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media View</title>
    <link rel="stylesheet" href="mediaView.css" />
  </head>
  <body>
    <div class="media-shell">
      <header class="media-topbar">
        <h1>Now Playing</h1>
        <div class="track-info">
          <span class="track-title">Starlight</span>
          <span class="track-artist">Luna Waves</span>
        </div>
      </header>

      <section class="media-player">
        <div class="cover">🎵</div>
        <div class="player-controls">
          <div class="time">1:24 / 3:40</div>
          <div class="buttons">
            <button>⏮</button>
            <button class="play">▶</button>
            <button>⏭</button>
          </div>
          <div class="progress-bar"><span></span></div>
        </div>
      </section>

      <section class="playlist">
        <h2>Up next</h2>
        <ul>
          <li><span>Moonlight Dive</span><span>3:58</span></li>
          <li><span>Neon Sky</span><span>4:12</span></li>
          <li><span>Echo Trails</span><span>3:40</span></li>
          <li><span>Solar Drift</span><span>5:05</span></li>
        </ul>
      </section>
    </div>
  </body>
</html>
